<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <!-- Herd Mentality's hub card: the game's sky, clouds and two hills over a daisy meadow. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6f4"/>
      <stop offset=".6" stop-color="#6fc3f8"/>
      <stop offset="1" stop-color="#bdeafc"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde44c"/>
      <stop offset="1" stop-color="#9fd23a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc22e"/>
      <stop offset="1" stop-color="#5fae26"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96cf47" stop-opacity="0"/>
      <stop offset=".35" stop-color="#96cf47"/>
      <stop offset="1" stop-color="#6fb944"/>
    </linearGradient>
    <path id="t" transform="scale(.6)" d="M0 0c-2-8-7-13-13-16 7 1 12 6 13 11 0-9 3-17 8-21-2 8-3 15-2 23 3-6 8-10 13-11-5 3-9 8-10 14z"/>
    <g id="d">
      <g fill="#fff"><circle cx="0" cy="-4" r="3.2"/><circle cx="3.8" cy="-1.2" r="3.2"/><circle cx="2.4" cy="3.3" r="3.2"/><circle cx="-2.4" cy="3.3" r="3.2"/><circle cx="-3.8" cy="-1.2" r="3.2"/></g>
      <circle r="2.3" fill="#f6d64a"/>
    </g>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <ellipse cx="300" cy="40" rx="50" ry="10" fill="#aee8ee"/>
  <g fill="#fff"><circle cx="266" cy="31" r="13"/><circle cx="288" cy="21" r="19"/><circle cx="314" cy="24" r="17"/><circle cx="336" cy="33" r="13"/><ellipse cx="301" cy="36" rx="46" ry="9"/></g>
  <ellipse cx="96" cy="46" rx="26" ry="6" fill="#aee8ee"/>
  <g fill="#fff"><circle cx="82" cy="39" r="9"/><circle cx="97" cy="32" r="12"/><circle cx="112" cy="39" r="9"/><ellipse cx="98" cy="43" rx="24" ry="6"/></g>
  <!-- The hills sit high so they show above the card's white panel. -->
  <g transform="translate(0 -112)">
  <path d="M150 300 C200 240 262 200 330 182 C370 172 400 170 420 170 L420 400 Z" fill="url(#back)"/>
  <path d="M-20 200 C30 168 80 148 130 148 C190 148 230 200 262 300 L-20 400 Z" fill="url(#front)"/>
  <g fill="#9bd84a" opacity=".9"><use href="#t" x="70" y="172"/><use href="#t" x="120" y="164"/><use href="#t" x="176" y="196"/></g>
  <g fill="#d2ef67" opacity=".85"><use href="#t" x="300" y="200"/><use href="#t" x="360" y="186"/><use href="#t" x="262" y="226"/></g>
  <rect y="200" width="400" height="260" fill="url(#meadow)"/>
  <g fill="#a6da64" opacity=".8"><use href="#t" x="40" y="262"/><use href="#t" x="150" y="284"/><use href="#t" x="260" y="258"/><use href="#t" x="360" y="280"/></g>
  <use href="#d" x="100" y="276"/><use href="#d" x="310" y="290"/><use href="#d" x="210" y="262"/>
  </g>
</svg>
