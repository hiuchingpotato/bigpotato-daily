name: Deploy to GitHub Pages

# The game data (75MB across 216 puzzle files) is not committed - binaries that
# large would live in git history forever, and every rebuild would add another
# copy. It is regenerated here instead, from the same GloVe vectors and the same
# pipeline used locally, so what ships is always what tools/build_data.py
# produces.

on:
  push:
    branches: [main]
  # So a pull request gets the same gate, and branch protection has a status
  # check to require. The deploy job is guarded below and does not run.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 990MB extracted. Cached because re-downloading 862MB on every push is
      # slower than restoring it, and it never changes.
      - name: Restore GloVe vectors
        id: glove
        uses: actions/cache@v4
        with:
          path: .tooling/glove.6B.300d.txt
          key: glove-6b-300d-v1

      - name: Download GloVe vectors
        if: steps.glove.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tooling
          curl -sSfL -o glove.zip \
            https://huggingface.co/stanfordnlp/glove/resolve/main/glove.6B.zip
          unzip -o glove.zip glove.6B.300d.txt -d .tooling/
          rm glove.zip

      # Public domain and MIT respectively, and too large to commit. The
      # British word list that decides hint quality *is* committed, because
      # builds must not depend on a live generator service.
      - name: Download the word lists
        run: |
          mkdir -p .tooling
          curl -sSfL -o .tooling/words_alpha.txt \
            https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt
          curl -sSfL -o .tooling/everyday_en.txt \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_full.txt

      - name: Build game data
        run: |
          pip install --quiet numpy
          python tools/closer/build_data.py

      - name: Install, test and build
        env:
          # Project sites are served from /<repo>/, not the domain root.
          PAGES_BASE: /bigpotato-daily/
          # P for Pizza's global leaderboard. Both are public by design (they ship in the
          # bundle; row-level security does the protecting). Unset, the build falls back
          # to a this-device-only leaderboard.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm test
          npm run build
          # Pages has no rewrites, so a deep link like /pizza/ would 404. Its 404 page
          # is served with the requested URL intact, so the app boots and routes itself.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    # Only ever publish from main. A pull request runs the build and the tests
    # for the status check, but must not put anything on the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
